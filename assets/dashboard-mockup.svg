  <!-- Window Header Bar -->
  <rect width="1100" height="46" rx="14" fill="#F1F5F9"/>
  <path d="M0 46 H1100" stroke="#CBD5E1" stroke-width="1"/>
  
  <!-- Window Controls -->
  <circle cx="28" cy="23" r="6" fill="#EF4444"/>
  <circle cx="48" cy="23" r="6" fill="#F59E0B"/>
  <circle cx="68" cy="23" r="6" fill="#10B981"/>

  <text x="100" y="28" class="dash-text" font-size="13" font-weight="700" fill="#0F172A">BlueMesh Command Center</text>
  <text x="300" y="28" class="mono-text" font-size="11" font-weight="700" fill="#64748B">MESH STATUS: ONLINE (16/16 NODES)</text>
  
  <!-- Header Live Pill -->
  <g transform="translate(970, 12)">
