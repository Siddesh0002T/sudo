    <text x="32" y="40" class="dash-text" font-size="13" font-weight="700" fill="#0369A1">📊 Campus Heatmap</text>

    <!-- Item 2 -->
    <g transform="translate(10, 62)">
      <rect width="190" height="36" rx="8" fill="transparent"/>
      <text x="22" y="23" class="dash-text" font-size="13" font-weight="600" fill="#475569">👥 Student Registry</text>
