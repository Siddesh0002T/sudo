<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="100%" height="100%">
  <defs>
    <linearGradient id="lightSecBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <linearGradient id="glowLineLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="secShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <style>
    .h-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 24px; font-weight: 800; fill: #0F172A; }
    .h-sub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; fill: #475569; font-weight: 500; }
    .card-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px; font-weight: 800; }
    .card-num { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 800; }
    .card-body { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11.5px; fill: #334155; }
    .crypto-code { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; }
    .badge-pill { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 800; }
  </style>

  <!-- Background -->
  <rect width="1100" height="500" rx="16" fill="url(#lightSecBg)" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Title Header -->
  <g transform="translate(40, 36)">
    <text x="0" y="0" class="h-title">Zero-Trust Biometric &amp; Cryptographic Pipeline</text>
    <text x="0" y="22" class="h-sub">How BlueMesh prevents replay attacks, proxy check-ins, and satisfies DPDP Act 2023 privacy mandates</text>
  </g>

  <!-- Connecting Pipeline Arrow -->
  <path d="M120 210 H980" stroke="url(#glowLineLight)" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- Step 1: On-Device Biometric Verification -->
  <g transform="translate(40, 95)" filter="url(#secShadow)">
    <rect width="185" height="340" rx="12" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.5"/>
    <rect width="185" height="34" rx="12" fill="#E0F2FE"/>
    <path d="M0 34 H185" stroke="#BAE6FD" stroke-width="1"/>
    <text x="14" y="22" class="card-num" fill="#0369A1">STEP 01</text>
    
    <g transform="translate(14, 50)">
      <text x="0" y="10" class="card-title" fill="#0369A1">Edge Biometrics</text>
      <text x="0" y="32" class="card-body">User scans thumb</text>
      <text x="0" y="48" class="card-body">on smart wristband.</text>
      
      <rect y="65" width="157" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="8" y="82" class="crypto-code" fill="#059669">✓ Match: 1:1 local</text>
      <text x="8" y="98" class="crypto-code" fill="#DC2626">✗ Raw img deleted</text>
      <text x="8" y="114" class="crypto-code" fill="#0284C7">🔒 Enclave protected</text>

      <text x="0" y="152" class="card-body" font-weight="700" fill="#0F172A">Privacy Guarantee:</text>
      <text x="0" y="172" class="card-body">• Zero biometric data ever</text>
      <text x="0" y="188" class="card-body">  leaves the secure chip</text>
      <text x="0" y="204" class="card-body">• 100% DPDP Act 2023</text>
      <text x="0" y="220" class="card-body">  compliant for minors</text>
    </g>

    <rect x="14" y="295" width="157" height="26" rx="6" fill="#F0F9FF" stroke="#BAE6FD"/>
    <text x="92" y="312" text-anchor="middle" class="badge-pill" fill="#0369A1">LOCAL VERIFY ONLY</text>
  </g>

  <!-- Step 2: Ephemeral Token Generation -->
  <g transform="translate(250, 95)" filter="url(#secShadow)">
    <rect width="185" height="340" rx="12" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5"/>
    <rect width="185" height="34" rx="12" fill="#F5F3FF"/>
    <path d="M0 34 H185" stroke="#DDD6FE" stroke-width="1"/>
    <text x="14" y="22" class="card-num" fill="#6D28D9">STEP 02</text>
    
    <g transform="translate(14, 50)">
      <text x="0" y="10" class="card-title" fill="#6D28D9">Anti-Replay Token</text>
      <text x="0" y="32" class="card-body">Generates rolling</text>
      <text x="0" y="48" class="card-body">cryptographic nonce.</text>
      
      <rect y="65" width="157" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="8" y="82" class="crypto-code" fill="#4338CA">HMAC(DevID || Nonce</text>
      <text x="8" y="96" class="crypto-code" fill="#4338CA"> || Timestamp, Secret)</text>
      <text x="8" y="112" class="crypto-code" fill="#D97706">TTL: 90 Seconds</text>

      <text x="0" y="152" class="card-body" font-weight="700" fill="#0F172A">Security Advantage:</text>
      <text x="0" y="172" class="card-body">• Sniffed packets cannot</text>
      <text x="0" y="188" class="card-body">  be cloned or replayed</text>
      <text x="0" y="204" class="card-body">• Dynamic rotating ID</text>
      <text x="0" y="220" class="card-body">  prevents eavesdropping</text>
    </g>

    <rect x="14" y="295" width="157" height="26" rx="6" fill="#FAF5FF" stroke="#DDD6FE"/>
    <text x="92" y="312" text-anchor="middle" class="badge-pill" fill="#6D28D9">ZERO-REPLAY ATTACK</text>
  </g>

  <!-- Step 3: Mesh Dynamic Relay -->
  <g transform="translate(460, 95)" filter="url(#secShadow)">
    <rect width="185" height="340" rx="12" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.5"/>
    <rect width="185" height="34" rx="12" fill="#CCFBF1"/>
    <path d="M0 34 H185" stroke="#99F6E4" stroke-width="1"/>
    <text x="14" y="22" class="card-num" fill="#0F766E">STEP 03</text>
    
    <g transform="translate(14, 50)">
      <text x="0" y="10" class="card-title" fill="#0F766E">ESP-NOW Multi-Hop</text>
      <text x="0" y="32" class="card-body">Packet hops across</text>
      <text x="0" y="48" class="card-body">unwired classroom nodes.</text>
      
      <rect y="65" width="157" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="8" y="82" class="crypto-code" fill="#0D9488">RSSI: -62 dBm</text>
      <text x="8" y="96" class="crypto-code" fill="#334155">Room_ID: 104_LAB</text>
      <text x="8" y="110" class="crypto-code" fill="#334155">Hop_Count: 2</text>

      <text x="0" y="152" class="card-body" font-weight="700" fill="#0F172A">Presence Beacon:</text>
      <text x="0" y="172" class="card-body">• Classroom anchor tags</text>
      <text x="0" y="188" class="card-body">  its unique location ID</text>
      <text x="0" y="204" class="card-body">• Measures proximity</text>
      <text x="0" y="220" class="card-body">  via RSSI thresholds</text>
    </g>

    <rect x="14" y="295" width="157" height="26" rx="6" fill="#F0FDFA" stroke="#99F6E4"/>
    <text x="92" y="312" text-anchor="middle" class="badge-pill" fill="#0F766E">GEOFENCE PROOF</text>
  </g>

  <!-- Step 4: Edge Gateway Aggregation -->
  <g transform="translate(670, 95)" filter="url(#secShadow)">
    <rect width="185" height="340" rx="12" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
    <rect width="185" height="34" rx="12" fill="#FEF3C7"/>
    <path d="M0 34 H185" stroke="#FDE68A" stroke-width="1"/>
    <text x="14" y="22" class="card-num" fill="#B45309">STEP 04</text>
    
    <g transform="translate(14, 50)">
      <text x="0" y="10" class="card-title" fill="#B45309">Gateway Bridge</text>
      <text x="0" y="32" class="card-body">Time syncs &amp; encrypts</text>
      <text x="0" y="48" class="card-body">payload for cloud uplink.</text>
      
      <rect y="65" width="157" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="8" y="82" class="crypto-code" fill="#B45309">NTP Timestamped</text>
      <text x="8" y="96" class="crypto-code" fill="#334155">TLS 1.3 Envelope</text>
      <text x="8" y="110" class="crypto-code" fill="#059669">De-duplication: OK</text>

      <text x="0" y="152" class="card-body" font-weight="700" fill="#0F172A">Fail-Safe Sync:</text>
      <text x="0" y="172" class="card-body">• Local NVRAM buffer</text>
      <text x="0" y="188" class="card-body">  survives power outages</text>
      <text x="0" y="204" class="card-body">• Auto flushes when 4G</text>
      <text x="0" y="220" class="card-body">  connection restores</text>
    </g>

    <rect x="14" y="295" width="157" height="26" rx="6" fill="#FFFBEB" stroke="#FDE68A"/>
    <text x="92" y="312" text-anchor="middle" class="badge-pill" fill="#B45309">OFFLINE RESILIENT</text>
  </g>

  <!-- Step 5: Immutable Cloud Ledger & Fraud AI -->
  <g transform="translate(875, 95)" filter="url(#secShadow)">
    <rect width="185" height="340" rx="12" fill="#FFFFFF" stroke="#FECDD3" stroke-width="1.5"/>
    <rect width="185" height="34" rx="12" fill="#FFE4E6"/>
    <path d="M0 34 H185" stroke="#FECDD3" stroke-width="1"/>
    <text x="14" y="22" class="card-num" fill="#BE123C">STEP 05</text>
    
    <g transform="translate(14, 50)">
      <text x="0" y="10" class="card-title" fill="#BE123C">Immutable Ledger</text>
      <text x="0" y="32" class="card-body">SHA-256 hash chaining</text>
      <text x="0" y="48" class="card-body">&amp; fraud detection.</text>
      
      <rect y="65" width="157" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="8" y="82" class="crypto-code" fill="#BE123C">Chain: SHA256(Prev)</text>
      <text x="8" y="96" class="crypto-code" fill="#059669">Fraud Check: PASS</text>
      <text x="8" y="110" class="crypto-code" fill="#334155">Audit Log Sealed</text>

      <text x="0" y="152" class="card-body" font-weight="700" fill="#0F172A">Fraud Prevention:</text>
      <text x="0" y="172" class="card-body">• Flags "Mark &amp; Leave"</text>
      <text x="0" y="188" class="card-body">• Detects Ghost profiles</text>
      <text x="0" y="204" class="card-body">• Public audit trail for</text>
      <text x="0" y="220" class="card-body">  any admin override</text>
    </g>

    <rect x="14" y="295" width="157" height="26" rx="6" fill="#FFF1F2" stroke="#FECDD3"/>
    <text x="92" y="312" text-anchor="middle" class="badge-pill" fill="#BE123C">TAMPER-PROOF</text>
  </g>
</svg>
